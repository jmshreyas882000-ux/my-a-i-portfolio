<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI CINEMATIC SYSTEM</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:black;
  font-family:Arial,sans-serif;
  color:white;
}

/* CANVAS */

#bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:0;
}

/* GRID */

.grid{
  position:fixed;
  inset:0;

  background-image:
  linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);

  background-size:50px 50px;

  z-index:1;
}

/* GLOW */

.glow{
  position:fixed;

  width:500px;
  height:500px;

  background:#00ffff;

  border-radius:50%;

  filter:blur(150px);

  opacity:0.15;

  top:-100px;
  left:-100px;

  animation:move 10s infinite alternate;

  z-index:1;
}

@keyframes move{

  from{
    transform:translate(0,0);
  }

  to{
    transform:translate(200px,100px);
  }

}

/* CONTENT */

.content{
  position:relative;

  z-index:10;

  height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;
}

/* TITLE */

h1{

  font-size:90px;

  background:
  linear-gradient(
    90deg,
    #ffffff,
    #00ffff
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  letter-spacing:5px;

  margin-bottom:20px;
}

#typing{

  color:#aaaaaa;

  font-size:20px;

  margin-bottom:40px;
}

/* HIDE CARDS TEMPORARILY */

.cards{
  display:none;
}

/* CURSOR GLOW */

.cursor-glow{

  position:fixed;

  width:300px;
  height:300px;

  border-radius:50%;

  background:rgba(0,255,255,0.15);

  filter:blur(80px);

  pointer-events:none;

  z-index:2;
}

/* LOADER */

#loader{

  position:fixed;

  inset:0;

  background:black;

  display:flex;
  justify-content:center;
  align-items:center;

  z-index:9999;

  animation:fadeOut 2s forwards;

  animation-delay:2s;
}

@keyframes fadeOut{

  to{
    opacity:0;
    visibility:hidden;
  }

}

/* SCANLINES */

body::after{

  content:"";

  position:fixed;

  inset:0;

  background:
  linear-gradient(
    rgba(255,255,255,0.03) 1px,
    transparent 1px
  );

  background-size:100% 3px;

  opacity:0.08;

  pointer-events:none;

  z-index:100;
}

</style>
</head>

<body>

<div id="loader">
  <h1>INITIALIZING AI SYSTEM...</h1>
</div>

<canvas id="bg"></canvas>

<div class="grid"></div>

<div class="glow"></div>

<div class="cursor-glow"></div>

<div class="content">

  <h1>AI SYSTEM</h1>

  <p id="typing"></p>

</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

/* SCENE */

const scene = new THREE.Scene();

scene.fog = new THREE.Fog(
  0x000000,
  10,
  80
);

/* CAMERA */

const camera =
new THREE.PerspectiveCamera(

  75,

  window.innerWidth /
  window.innerHeight,

  0.1,

  1000

);

camera.position.z = 12;

/* RENDERER */

const renderer =
new THREE.WebGLRenderer({

  canvas:
  document.getElementById("bg"),

  antialias:true,

  alpha:true

});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  window.devicePixelRatio
);

renderer.setClearColor(
  0x000000,
  1
);

/* PARTICLES */

const particlesGeometry =
new THREE.BufferGeometry();

const particleCount = 5000;

const positions =
new Float32Array(
  particleCount * 3
);

for(let i=0;i<particleCount*3;i++){

  positions[i] =
  (Math.random()-0.5) * 100;

}

particlesGeometry.setAttribute(

  'position',

  new THREE.BufferAttribute(
    positions,
    3
  )

);

const particlesMaterial =
new THREE.PointsMaterial({

  color:0x00ffff,

  size:0.08

});

const particlesMesh =
new THREE.Points(

  particlesGeometry,
  particlesMaterial

);

scene.add(particlesMesh);

/* CENTER SPHERE */

const sphereGeometry =
new THREE.SphereGeometry(
  5,
  64,
  64
);

const sphereMaterial =
new THREE.MeshBasicMaterial({

  color:0x00ffff,

  wireframe:true

});

const sphere =
new THREE.Mesh(
  sphereGeometry,
  sphereMaterial
);

scene.add(sphere);

/* LIGHTS */

const pointLight =
new THREE.PointLight(
  0xffffff,
  10,
  100
);

pointLight.position.set(
  0,
  0,
  20
);

scene.add(pointLight);

const ambientLight =
new THREE.AmbientLight(
  0xffffff,
  2
);

scene.add(ambientLight);

/* BIG TEST CUBE */

const robotGeometry =
new THREE.BoxGeometry(
  8,
  8,
  8
);

const robotMaterial =
new THREE.MeshStandardMaterial({

  color:0xff0000,

  emissive:0xff0000,

  emissiveIntensity:2

});

const robot =
new THREE.Mesh(

  robotGeometry,
  robotMaterial

);

robot.position.set(
  0,
  0,
  2
);

scene.add(robot);

/* CURSOR GLOW */

const glow =
document.querySelector(".cursor-glow");

window.addEventListener(

  "mousemove",

  (e)=>{

    glow.style.left =
    e.clientX - 150 + "px";

    glow.style.top =
    e.clientY - 150 + "px";

  }

);

/* TYPING EFFECT */

const text =
"Building futuristic AI systems for the next generation.";

let i = 0;

function type(){

  if(i < text.length){

    document
    .getElementById("typing")
    .innerHTML += text.charAt(i);

    i++;

    setTimeout(type,40);

  }

}

type();

/* ANIMATION */

function animate(){

  requestAnimationFrame(animate);

  particlesMesh.rotation.y += 0.0008;

  sphere.rotation.x += 0.002;

  sphere.rotation.y += 0.003;

  robot.rotation.x += 0.01;

  robot.rotation.y += 0.01;

  robot.position.y =
  Math.sin(Date.now()*0.002) * 0.5;

  renderer.render(
    scene,
    camera
  );

}

animate();

/* RESIZE */

window.addEventListener(

  "resize",

  ()=>{

    camera.aspect =
    window.innerWidth /
    window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }

);

</script>

</body>
</html>
