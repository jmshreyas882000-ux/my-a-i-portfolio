<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI CINEMATIC SYSTEM</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:black;
  font-family:Arial, sans-serif;
  color:white;
}

/* CANVAS */

#bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-20;
}

/* GRID */

.grid{
  position:fixed;
  inset:0;

  background-image:
  linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);

  background-size:50px 50px;

  z-index:-5;
}

/* GLOW */

.glow{
  position:fixed;
  width:500px;
  height:500px;

  background:#00ffff;

  border-radius:50%;

  filter:blur(150px);

  opacity:0.15;

  top:-100px;
  left:-100px;

  animation:move 10s infinite alternate;
}

@keyframes move{

  from{
    transform:translate(0,0);
  }

  to{
    transform:translate(200px,100px);
  }

}

/* CONTENT */

.content{
  position:relative;
  z-index:10;

  height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;
}

h1{
  font-size:90px;

  background:linear-gradient(90deg,#ffffff,#00ffff);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  letter-spacing:4px;
}

p{
  margin-top:20px;
  color:#aaa;
  font-size:20px;
}

/* CARDS */

.cards{
  display:flex;
  gap:25px;
  margin-top:40px;
  flex-wrap:wrap;
  justify-content:center;
}

.card{
  width:300px;

  padding:30px;

  border-radius:25px;

  background:rgba(255,255,255,0.05);

  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,0.08);

  transition:0.5s;
}

.card:hover{
  transform:translateY(-12px) scale(1.03);

  box-shadow:
  0 0 40px rgba(0,255,255,0.3);
}

.card h2{
  margin-bottom:15px;
  color:#00ffff;
}

/* CURSOR GLOW */

.cursor-glow{
  position:fixed;

  width:300px;
  height:300px;

  border-radius:50%;

  background:rgba(0,255,255,0.15);

  filter:blur(80px);

  pointer-events:none;

  z-index:1;
}

/* LOADER */

#loader{
  position:fixed;
  inset:0;

  background:black;

  display:flex;
  justify-content:center;
  align-items:center;

  z-index:9999;

  animation:fadeOut 2s forwards;
  animation-delay:2s;
}

@keyframes fadeOut{

  to{
    opacity:0;
    visibility:hidden;
  }

}

/* SCANLINE */

body::after{
  content:"";

  position:fixed;
  inset:0;

  background:
  linear-gradient(
    rgba(255,255,255,0.03) 1px,
    transparent 1px
  );

  background-size:100% 3px;

  pointer-events:none;

  opacity:0.08;
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div id="loader">
  <h1>INITIALIZING AI SYSTEM...</h1>
</div>

<div class="grid"></div>

<div class="glow"></div>

<div class="cursor-glow"></div>

<div class="content">

  <h1>AI SYSTEM</h1>

  <p id="typing"></p>

  <div class="cards">

    <div class="card">
      <h2>AI ENGINEERING</h2>
      <p>Building intelligent systems and neural interfaces.</p>
    </div>

    <div class="card">
      <h2>FINTECH</h2>
      <p>Real-time stock and crypto intelligence dashboards.</p>
    </div>

    <div class="card">
      <h2>3D SYSTEMS</h2>
      <p>Creating cinematic futuristic web experiences.</p>
    </div>

  </div>

</div>

<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js';


/* SCENE */

const scene = new THREE.Scene();

scene.fog = new THREE.Fog(0x000000,10,80);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.z = 20;

/* RENDERER */

const renderer = new THREE.WebGLRenderer({
  canvas:document.getElementById("bg"),
  antialias:true,
  alpha:true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(window.devicePixelRatio);

/* PARTICLES */

const particlesGeometry = new THREE.BufferGeometry();

const particleCount = 5000;

const positions = new Float32Array(
  particleCount * 3
);

for(let i=0;i<particleCount*3;i++){

  positions[i] = (Math.random()-0.5) * 100;

}

particlesGeometry.setAttribute(
  'position',
  new THREE.BufferAttribute(positions,3)
);

const particlesMaterial = new THREE.PointsMaterial({

  color:0x00ffff,
  size:0.08

});

const particlesMesh = new THREE.Points(
  particlesGeometry,
  particlesMaterial
);

scene.add(particlesMesh);

/* AI CORE */

const sphereGeometry = new THREE.SphereGeometry(
  5,
  64,
  64
);

const sphereMaterial = new THREE.MeshBasicMaterial({

  color:0x00ffff,
  wireframe:true

});

const sphere = new THREE.Mesh(
  sphereGeometry,
  sphereMaterial
);

scene.add(sphere);

/* LIGHT */
  
/* ROBOT MODEL */

/* ROBOT MODEL */

const clock = new THREE.Clock();

let mixer;

const loader = new GLTFLoader();

loader.load(

'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',

(gltf)=>{

    const robot = gltf.scene;

    robot.scale.set(2.5,2.5,2.5);

    robot.position.set(0,-4,0);

    robot.rotation.y = Math.PI;

    scene.add(robot);

    mixer = new THREE.AnimationMixer(robot);

    const action = mixer.clipAction(
      gltf.animations[0]
    );

    action.play();

},

undefined,

(error)=>{
    console.log(error);
}

);
  /* ROBOT LIGHT */

const robotLight = new THREE.SpotLight(
  0x00ffff,
  10
);

robotLight.position.set(0,20,20);

robotLight.angle = 0.3;

scene.add(robotLight);
const light = new THREE.PointLight(
  0x00ffff,
  5,
  100
);

light.position.set(0,0,15);

scene.add(light);

/* MOUSE */

let mouseX = 0;
let mouseY = 0;

window.addEventListener("mousemove",(e)=>{

  mouseX =
  (e.clientX / window.innerWidth - 0.5);

  mouseY =
  (e.clientY / window.innerHeight - 0.5);

});

/* CURSOR GLOW */

const glow = document.querySelector(".cursor-glow");

window.addEventListener("mousemove",(e)=>{

  glow.style.left = e.clientX - 150 + "px";
  glow.style.top = e.clientY - 150 + "px";

});

/* TYPING EFFECT */

const text =
"Building futuristic AI systems for the next generation.";

let i = 0;

function type(){

  if(i < text.length){

    document.getElementById("typing").innerHTML += text.charAt(i);

    i++;

    setTimeout(type,40);

  }

}

type();

/* ANIMATION */

/* ANIMATION */

function animate(){

  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if(mixer){
    mixer.update(delta);
  }

  particlesMesh.rotation.y += 0.0008;

  sphere.rotation.x += 0.002;
  sphere.rotation.y += 0.003;

  sphere.position.y =
  Math.sin(Date.now()*0.001) * 0.8;

  scene.rotation.y = mouseX * 0.3;
  scene.rotation.x = mouseY * 0.2;

  renderer.render(scene,camera);

}

animate();

/* RESIZE */

window.addEventListener("resize",()=>{

  camera.aspect =
  window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>

</body>
</html>
