<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI CINEMATIC SYSTEM</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:black;
  font-family:Arial;
  color:white;
}

/* Background */

#bg{
  position:fixed;
  inset:0;
}

/* Grid */

.grid{
  position:fixed;
  inset:0;

  background-image:
  linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);

  background-size:50px 50px;

  z-index:1;
}

/* Glow */

.glow{
  position:fixed;
  width:500px;
  height:500px;

  background:#00ffff;

  border-radius:50%;

  filter:blur(150px);

  opacity:0.2;

  top:-100px;
  left:-100px;

  animation:move 10s infinite alternate;
}

@keyframes move{

  from{
    transform:translate(0,0);
  }

  to{
    transform:translate(200px,100px);
  }

}

/* Content */

.content{
  position:relative;
  z-index:10;

  height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;
}

h1{
  font-size:80px;

  background:linear-gradient(90deg,#fff,#00ffff);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

p{
  margin-top:20px;
  color:#aaa;
  font-size:20px;
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="grid"></div>

<div class="glow"></div>

<div class="content">

<h1>AI SYSTEM</h1>

<p>Live Neural Cinematic Background</p>

</div>

<script>

const canvas = document.getElementById("bg");

const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = [];

class Particle{

  constructor(){

    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;

    this.size = Math.random() * 3;

    this.speedX = (Math.random()-0.5)*1;
    this.speedY = (Math.random()-0.5)*1;

  }

  update(){

    this.x += this.speedX;
    this.y += this.speedY;

    if(this.x < 0 || this.x > canvas.width){
      this.speedX *= -1;
    }

    if(this.y < 0 || this.y > canvas.height){
      this.speedY *= -1;
    }

  }

  draw(){

    ctx.beginPath();

    ctx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle = "#00ffff";

    ctx.fill();

  }

}

/* Create particles */

for(let i=0;i<120;i++){

  particles.push(new Particle());

}

/* Connect lines */

function connect(){

  for(let a=0;a<particles.length;a++){

    for(let b=a;b<particles.length;b++){

      const dx = particles[a].x - particles[b].x;
      const dy = particles[a].y - particles[b].y;

      const distance = dx*dx + dy*dy;

      if(distance < 10000){

        ctx.strokeStyle =
        "rgba(0,255,255,"+(1-distance/10000)+")";

        ctx.lineWidth = 0.5;

        ctx.beginPath();

        ctx.moveTo(
          particles[a].x,
          particles[a].y
        );

        ctx.lineTo(
          particles[b].x,
          particles[b].y
        );

        ctx.stroke();

      }

    }

  }

}

/* Animation */

function animate(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  particles.forEach((particle)=>{

    particle.update();
    particle.draw();

  });

  connect();

  requestAnimationFrame(animate);

}

animate();

/* Resize */

window.addEventListener("resize",()=>{

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

});

</script>

</body>
</html>
